<text x="30" y="34" font-family="SFMono-Regular,Consolas,'Courier New',monospace" font-size="8.5" font-weight="700" letter-spacing="2" fill="#8e92aa">PAD 2 · BACKEND API</text><text x="30" y="62" font-family="SFMono-Regular,Consolas,'Courier New',monospace" font-size="15" font-weight="700" fill="#fff">task-tracker-api</text><text x="30" y="88" font-family="SFMono-Regular,Consolas,'Courier New',monospace" font-size="10" fill="#a9afc8">A Jira/Trello-style backend with JWT auth. Projects and tasks</text><text x="30" y="102" font-family="SFMono-Regular,Consolas,'Courier New',monospace" font-size="10" fill="#a9afc8">with filtering, search and pagination, covered by pytest.</text><rect x="30" y="132" width="59" height="20" rx="10" fill="#7c5cff" fill-opacity=".12" stroke="#7c5cff" stroke-opacity=".5"/><text x="59" y="146" text-anchor="middle" font-family="SFMono-Regular,Consolas,'Courier New',monospace" font-size="9" font-weight="700" fill="#e6eaff">FastAPI</text><rect x="97" y="132" width="77" height="20" rx="10" fill="#7c5cff" fill-opacity=".12" stroke="#7c5cff" stroke-opacity=".5"/><text x="135" y="146" text-anchor="middle" font-family="SFMono-Regular,Consolas,'Courier New',monospace" font-size="9" font-weight="700" fill="#e6eaff">SQLAlchemy</text><rect x="182" y="132" width="53" height="20" rx="10" fill="#7c5cff" fill-opacity=".12" stroke="#7c5cff" stroke-opacity=".5"/><text x="208" y="146" text-anchor="middle" font-family="SFMono-Regular,Consolas,'Courier New',monospace" font-size="9" font-weight="700" fill="#e6eaff">Docker</text><rect x="242" y="132" width="46" height="20" rx="10" fill="#7c5cff" fill-opacity=".12" stroke="#7c5cff" stroke-opacity=".5"/><text x="266" y="146" text-anchor="middle" font-family="SFMono-Regular,Consolas,'Courier New',monospace" font-size="9" font-weight="700" fill="#e6eaff">React</text></svg>