ill="#E8452A"/><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.1s" dur=".45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="0.1s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/><g transform="translate(64,52)"><rect width="64" height="64" rx="16" fill="#fff"/><text class="i" x="32" y="46" font-size="34" fill="#FF5A3D" text-anchor="middle">03</text></g><text class="s" x="152" y="102" font-size="70" font-weight="900" fill="#E8452A" letter-spacing="1" transform="translate(5,5)">PROJECTS</text><text class="s" x="152" y="102" font-size="70" font-weight="900" fill="#fff" letter-spacing="1">PROJECTS</text><text class="s" x="154" y="132" font-size="13" font-weight="800" letter-spacing="5" fill="#FFC531">THINGS I HAVE BUILT AND BROKEN</text></g><g><g class="pop" style="animation-duration:3.4s;animation-delay:-0s"><polygon points="1025.4,98 1060,118 1060,78 1025.4,58" fill="#6247E6" /><polygon points="1094.6,98 1060,118 1060,78 1094.6,58" fill="#4F36CC" /><polygon points="1060,38 1094.6,58 1060,78 1025.4,58" fill="#7B61FF" /></g><g class="pop" style="animation-duration:4.1s;animation-delay:-1s"><polygon points="1063.5,120 1098.1,140 1098.1,114 1063.5,94" fill="#F2AE0E" /><polygon points="1132.7,120 1098.1,140 1098.1,114 1132.7,94" fill="#D99A00" /><polygon points="1098.1,74 1132.7,94 1098.1,114 1063.5,94" fill="#FFC531" /></g><g class="pop" style="animation-duration:4.8s;animation-delay:-2s"><polygon points="987.3,120 1021.9,140 1021.9,126 987.3,106" fill="#1F9894" /><polygon points="1056.5,120 1021.9,140 1021.9,126 1056.5,106" fill="#177B78" /><polygon points="1021.9,86 1056.5,106 1021.9,126 987.3,106" fill="#2BB7B3" /></g><g class="pop" style="animation-duration:3.4s;animation-delay:-3s"><polygon points="1025.4,142 1060,162 1060,110 1025.4,90" fill="#2C62DB" /><polygon points="1094.6,142 1060,162 1060,110 1094.6,90" fill="#2150B8" /><polygon points="1060,70 