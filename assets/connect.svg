pacity" from="0" to="1" begin="0.1s" dur=".45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="0.1s" dur="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/><g transform="translate(64,52)"><rect width="64" height="64" rx="16" fill="#fff"/><text class="i" x="32" y="46" font-size="34" fill="#FF5A3D" text-anchor="middle">05</text></g><text class="s" x="152" y="102" font-size="70" font-weight="900" fill="#E8452A" letter-spacing="1" transform="translate(5,5)">CONNECT</text><text class="s" x="152" y="102" font-size="70" font-weight="900" fill="#fff" letter-spacing="1">CONNECT</text><text class="s" x="154" y="132" font-size="13" font-weight="800" letter-spacing="5" fill="#FFC531">SAY HELLO, I REPLY FAST</text></g><g><g class="pop" style="animation-duration:3.4s;animation-delay:-0s"><polygon points="1016.7,103 1060,128 1060,98 1016.7,73" fill="#2C62DB" /><polygon points="1103.3,103 1060,128 1060,98 1103.3,73" fill="#2150B8" /><polygon points="1060,48 1103.3,73 1060,98 1016.7,73" fill="#3D7BFF" /></g><g class="pop" style="animation-duration:4.1s;animation-delay:-1s"><polygon points="1063.5,130 1098.1,150 1098.1,130 1063.5,110" fill="#1F9894" /><polygon points="1132.7,130 1098.1,150 1098.1,130 1132.7,110" fill="#177B78" /><polygon points="1098.1,90 1132.7,110 1098.1,130 1063.5,110" fill="#2BB7B3" /></g><g class="pop" style="animation-duration:4.8s;animation-delay:-2s"><polygon points="990.7,128 1021.9,146 1021.9,126 990.7,108" fill="#F2AE0E" /><polygon points="1053.1,128 1021.9,146 1021.9,126 1053.1,108" fill="#D99A00" /><polygon points="1021.9,90 1053.1,108 1021.9,126 990.7,108" fill="#FFC531" /></g><g class="pop" style="animation-duration:3.4s;animation-delay:-3s"><polygon points="1021.9,154 1060,176 1060,136 1021.9,114" fill="#6247E6" /><polygon points="1098.1,154 1060,176 1060,136 1098.1,114" fill="#4F36CC" /><polygon points="1060,92 1098.1,114 1060,136 1021.9,114" fill="#7B61FF" /></g></g