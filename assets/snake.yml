name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#f26a1f&color_dots=#e8f1fd,#b9d8fb,#7fb8f6,#3f8fe8,#1d55d8
            dist/github-snake-dark.svg?color_snake=#f6b919&color_dots=#14233f,#12408f,#1d55d8,#46b8ff,#b9e4ff
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
